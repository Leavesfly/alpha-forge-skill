# 《炒股的智慧》核心原则的可回测落地（陈江挺）
# 用法：uv run python run_custom.py --symbol 600000.SH --rules examples/wisdom_rule.toml --stop-loss 0.05
#
# 原则 -> 规则映射：
#   顺势而为（大势） -> close > 200 日均线（书中以 200 日线为牛熊分界，大势不对不做多）
#   顺势而为（动能） -> ma20 > ma60（多头排列，只买升势中的股票，不接下跌飞刀）
#   等待关键点       -> close 上穿布林上轨（突破动态阻力）+ 放量确认（量能配合）
#   让利润奔跑       -> 不设固定止盈，仅在 close 下破 20 日均线（趋势破坏）时离场
#   金字塔加仓       -> [pyramid] 试探性买入：首批 1/4 仓，每浮盈 3% 再加一批
#   截断亏损         -> 用 CLI 的 --stop-loss 控制单笔最大浮亏（书中纪律：错了立刻砍，
#                       不抱侥幸；满仓时 0.02~0.05 等价书中本金 2% 原则的价位换算）
#
# 局限（书中原则无法全部 DSL 化，需人工补位）：
#   - 大市环境（大盘趋势不对时休息）：单标的规则看不到指数，请自行留意大盘；
#   - 临界点附近的「小止损」：书中强调在关键点买入所以止损可以很小，
#     实盘可按「跌破平台上沿/突破失败」手工设止损，--stop-loss 是兜底纪律。

[meta]
name = "wisdom"
description = "炒股的智慧：大势+多头排列顺势，关键点放量突破入场，趋势破坏离场，让利润奔跑"

# ---------- 指标定义 ----------

[indicators.ma200]
type = "sma"
period = 200
source = "close"

[indicators.ma60]
type = "sma"
period = 60
source = "close"

[indicators.ma20]
type = "sma"
period = 20
source = "close"

[indicators.boll_upper]
type = "bollinger_upper"
period = 20
std = 2.0
source = "close"

[indicators.vol_ma20]
type = "sma"
period = 20
source = "volume"

# ---------- 入场：大势 + 多头排列 + 关键点突破 + 放量（AND） ----------

[entry]
logic = "and"
conditions = [
    "close crosses_above boll_upper",   # 关键点：突破布林上轨（动态阻力）
    "close > ma200",                    # 大势：200 日线上方才做多（牛熊分界）
    "ma20 > ma60",                      # 动能：多头排列，只买升势中的股票
    "volume > vol_ma20",                # 量能确认：放量突破更可信
]

# ---------- 离场：只认趋势破坏，不设固定止盈（让利润奔跑） ----------

[exit]
logic = "or"
conditions = [
    "close crosses_below ma20",         # 趋势破坏：跌破 20 日均线离场
]

# ---------- 金字塔分批加仓：试探性买入，对了再加码 ----------

[pyramid]
units = 4     # 分 4 批建满仓（首批 25%）
step = 0.03   # 每浮盈 3%（相对上次加仓价）再加一批
