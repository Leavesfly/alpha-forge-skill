name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (incl. dev group)
        working-directory: scripts
        # --locked：uv.lock 已纳入版本控制，若与 pyproject.toml 不一致则直接失败，
        # 避免锁文件静默漂移导致「本地能跑、CI 挂」或首次安装退化为冷解析。
        run: uv sync --group dev --locked

      - name: Lint (ruff)
        working-directory: scripts
        run: uv run ruff check . --output-format=github

      - name: Run test suite
        working-directory: scripts
        run: uv run pytest tests/ -q

      - name: Coverage report
        working-directory: scripts
        run: uv run pytest tests/ -q --cov=. --cov-report=term-missing --no-header || true
